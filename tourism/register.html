<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IITB Scheme Registration</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="form-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="form-container">
        <div class="progress-bar">
            <div class="step active">Personal Info</div>
            <div class="step">Travel Details</div>
            <div class="step">Documents</div>
        </div>

        <form id="registrationForm">
            <!-- Page 1: Personal Information -->
            <div class="form-page" id="page1">
                <h2>Personal Information</h2>
                
                <div class="form-group">
                    <label for="fullName">Full Name (as per Aadhaar)</label>
                    <input type="text" id="fullName" name="fullName" required>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob" required>
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="aadhaar">Aadhaar Number</label>
                    <input type="text" id="aadhaar" name="aadhaar" pattern="[0-9]{12}" required>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" required>
                </div>

                <div class="form-group">
                    <label for="email">Email ID</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="state">State</label>
                    <input type="text" id="state" name="state" required>
                </div>

                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" name="city" required>
                </div>
                <div class="form-group">
                    <label for="district">District</label>
                    <input type="text" id="district" name="district" required>
                </div>

                <div class="form-group">
                    <label for="pincode">PIN Code</label>
                    <input type="text" id="pincode" name="pincode" pattern="[0-9]{6}" required>
                </div>

                <button type="button" class="next-btn">Next</button>
            </div>

            <!-- Page 2: Travel Details -->
            <div class="form-page hidden" id="page2">
                <h2>Travel & Preferences</h2>

                <div class="form-group">
                    <label>Have you traveled to another state before?</label>
                    <div class="radio-group">
                        <input type="radio" id="travelYes" name="previousTravel" value="yes">
                        <label for="travelYes">Yes</label>
                        <input type="radio" id="travelNo" name="previousTravel" value="no">
                        <label for="travelNo">No</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="preferredStates">Preferred Travel States</label>
                    <select id="preferredStates" name="preferredStates[]" multiple required>
                        <option value="Andaman and Nicobar Islands">Andaman and Nicobar Islands</option>
                        <option value="Andhra Pradesh">Andhra Pradesh</option>
                        <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                        <option value="Assam">Assam</option>
                        <option value="Bihar">Bihar</option>
                        <option value="Chandigarh">Chandigarh</option>
                        <option value="Chhattisgarh">Chhattisgarh</option>
                        <option value="Dadra and Nagar Haveli and Daman and Diu">Dadra and Nagar Haveli and Daman and Diu</option>
                        <option value="Delhi">Delhi</option>
                        <option value="Goa">Goa</option>
                        <option value="Gujarat">Gujarat</option>
                        <option value="Haryana">Haryana</option>
                        <option value="Himachal Pradesh">Himachal Pradesh</option>
                        <option value="Jammu and Kashmir">Jammu and Kashmir</option>
                        <option value="Jharkhand">Jharkhand</option>
                        <option value="Karnataka">Karnataka</option>
                        <option value="Kerala">Kerala</option>
                        <option value="Ladakh">Ladakh</option>
                        <option value="Lakshadweep">Lakshadweep</option>
                        <option value="Madhya Pradesh">Madhya Pradesh</option>
                        <option value="Maharashtra">Maharashtra</option>
                        <option value="Manipur">Manipur</option>
                        <option value="Meghalaya">Meghalaya</option>
                        <option value="Mizoram">Mizoram</option>
                        <option value="Nagaland">Nagaland</option>
                        <option value="Odisha">Odisha</option>
                        <option value="Puducherry">Puducherry</option>
                        <option value="Punjab">Punjab</option>
                        <option value="Rajasthan">Rajasthan</option>
                        <option value="Sikkim">Sikkim</option>
                        <option value="Tamil Nadu">Tamil Nadu</option>
                        <option value="Telangana">Telangana</option>
                        <option value="Tripura">Tripura</option>
                        <option value="Uttar Pradesh">Uttar Pradesh</option>
                        <option value="Uttarakhand">Uttarakhand</option>
                        <option value="West Bengal">West Bengal</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="travelPurpose">Purpose of Travel</label>
                    <select id="travelPurpose" name="travelPurpose" required>
                        <option value="">Select Purpose</option>
                        <option value="tourism">Tourism</option>
                        <option value="work">Work</option>
                        <option value="education">Education</option>
                        <option value="adventure">Adventure</option>
                        <option value="heritage">Heritage Visit</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Special Categories</label>
                    <div class="checkbox-group">
                        <input type="checkbox" id="student" name="categories[]" value="student">
                        <label for="student">Student</label>
                        
                        <input type="checkbox" id="senior" name="categories[]" value="senior">
                        <label for="senior">Senior Citizen</label>
                        
                        <input type="checkbox" id="disabled" name="categories[]" value="disabled">
                        <label for="disabled">Differently-Abled</label>
                        
                        <input type="checkbox" id="tribal" name="categories[]" value="tribal">
                        <label for="tribal">Tribal Community</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="transport">Preferred Mode of Transport</label>
                    <select id="transport" name="transport" required>
                        <option value="">Select Transport</option>
                        <option value="train">Train</option>
                        <option value="flight">Flight</option>
                        <option value="bus">Bus</option>
                        <option value="eco">Eco-friendly Options</option>
                    </select>
                </div>

                <button type="button" class="prev-btn">Previous</button>
                <button type="button" class="next-btn">Next</button>
            </div>

            <!-- Page 3: Documents & Declaration -->
            <div class="form-page hidden" id="page3">
                <h2>Documents & Declaration</h2>

                <div class="form-group">
                    <label for="aadhaarDoc">Aadhaar Card Upload</label>
                    <input type="file" id="aadhaarDoc" name="aadhaarDoc" required>
                </div>

                <div class="form-group">
                    <label for="upiId">UPI ID</label>
                    <input type="text" id="upiId" name="upiId">
                </div>

                <div class="form-group">
                    <label>Other Government Benefits</label>
                    <div class="radio-group">
                        <input type="radio" id="benefitsYes" name="govBenefits" value="yes">
                        <label for="benefitsYes">Yes</label>
                        <input type="radio" id="benefitsNo" name="govBenefits" value="no">
                        <label for="benefitsNo">No</label>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">I agree to the terms & conditions</label>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="aadhaarConsent" name="aadhaarConsent" required>
                        <label for="aadhaarConsent">I consent to Aadhaar verification</label>
                    </div>
                </div>

                <button type="button" class="prev-btn">Previous</button>
                <button type="submit" class="submit-btn">Submit</button>
            </div>
        </form>
    </div>

    <script src="form.js"></script>
</body>
</html>
